worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    # Traefik and the API emit operational logs; avoid raw request/query logs.
    access_log off;
    client_body_temp_path /tmp/client;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    server_tokens off;
    # Separate private operations listener. It is never the public router's
    # backend port; the homelab catalog restricts it to Prometheus/health.
    server {
        listen 9090;
        resolver 127.0.0.11 valid=5s ipv6=off;
        resolver_timeout 1s;
        location = /metrics {
            limit_except GET { deny all; }
            set $ops_api http://api:8000;
            proxy_pass $ops_api$request_uri;
        }
        location = /ready {
            limit_except GET { deny all; }
            set $ops_api http://api:8000;
            proxy_pass $ops_api$request_uri;
        }
        location / { return 404; }
    }
    server {
        listen 3000;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;
        resolver 127.0.0.11 valid=5s ipv6=off;
        resolver_timeout 1s;
        location = /health { access_log off; return 200 'ok'; }
        location /api/v1/ {
            limit_except GET { deny all; }
            set $public_api http://api:8000;
            proxy_pass $public_api$request_uri;
            proxy_set_header Host $host;
            proxy_set_header traceparent $http_traceparent;
            proxy_connect_timeout 3s;
            proxy_read_timeout 10s;
        }
        # No proxy route to private readiness, metrics or OpenAPI/admin.
        location /assets/ {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
        location / { try_files $uri $uri/ /index.html; add_header Cache-Control "no-cache"; }
    }
}
