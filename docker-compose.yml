services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      GRIDORACLE_SAMPLE_DATA: "1"
    ports:
      - "5433:5432"
    volumes:
      # A distinct default volume prevents the safe sample startup from
      # attaching to a pre-existing legacy database volume.
      - gridoracle_sample_pgdata:/var/lib/postgresql/data
      - ./db/migrations:/migrations:ro
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - ./db/sample:/sample:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health').read()",
        ]
      interval: 2s
      timeout: 2s
      retries: 10

  pipeline:
    build:
      context: .
      dockerfile: pipeline/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL}
      OPENWEATHER_API_KEY: ${OPENWEATHER_API_KEY}
    volumes:
      - fastf1_cache:/app/pipeline/data/fastf1_cache
      - model_artifacts:/app/pipeline/ml/artifacts
    depends_on:
      db:
        condition: service_healthy
    # Provider calls and legacy scheduler side effects are explicit opt-in.
    profiles: ["scheduler"]

  dashboard:
    build:
      context: ./dashboard
    ports:
      - "3000:3000"
    environment:
      VITE_API_URL: ${API_URL}

volumes:
  gridoracle_sample_pgdata:
  fastf1_cache:
  model_artifacts:
