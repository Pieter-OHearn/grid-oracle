name: Pipeline Tests

on:
  push:
    paths:
      - "pipeline/**"
      - "scripts/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/pipeline-tests.yml"
  pull_request:
    paths:
      - "pipeline/**"
      - "scripts/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/pipeline-tests.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: pipeline/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r pipeline/requirements-dev.txt

      - name: Lint
        run: |
          ruff check pipeline/ scripts/
          ruff format --check pipeline/ scripts/

      - name: Test
        run: python -m pytest pipeline/tests/ -v
