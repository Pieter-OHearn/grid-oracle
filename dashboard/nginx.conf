server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker DNS is queried per request, so a missing/recreated API does not
    # prevent static assets from serving or require a frontend restart.
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 1s;

    location /api/v1/ {
        set $public_api http://api:8000;
        proxy_pass $public_api$request_uri;
        proxy_set_header Host $host;
    }
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
